<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320"><title>Schnittstellen im Vergleich: USB-A, USB-C, HDMI, DisplayPort, RJ45</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="880" height="320" rx="14" fill="#262626"/><rect x="15" y="20" width="160" height="262" rx="12" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="95" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">USB-A</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="95" y="217.6">USB 2.0 bis USB 3.2</tspan><tspan x="95" y="232.0">blau = ab USB 3.x</tspan><tspan x="95" y="246.4">nicht verdrehsicher</tspan></text><rect x="55" y="90" width="80" height="44" rx="4" fill="#c4c9cf" fill-opacity="0.9" stroke="#8d949c" stroke-width="1.2"/><rect x="63" y="98" width="64" height="16" rx="2" fill="#3d6fd6" fill-opacity="1" stroke="#2a4f9c" stroke-width="1.2"/><rect x="190" y="20" width="160" height="262" rx="12" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="270" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">USB-C</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="m