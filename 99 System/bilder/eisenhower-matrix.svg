<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380"><title>Eisenhower-Matrix zur Priorisierung</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="640" height="380" rx="14" fill="#262626"/><rect x="150" y="50" width="220" height="140" rx="10" fill="#e5484d" fill-opacity="0.16" stroke="#e5484d" stroke-width="1.2"/><rect x="150" y="50" width="220" height="140" rx="10" fill="none" fill-opacity="1" stroke="#e5484d" stroke-width="1.6"/><text x="260.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">A · sofort selbst erledigen</text><text x="260.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">z. B. Server ausgefallen</text><rect x="380" y="50" width="220" height="140" rx="10" fill="#4a8ff0" fill-opacity="0.16" stroke="#4a8ff0" stroke-width="1.2"/><rect x="380" y="50" width="220" height="140" rx="10" fill="none" fill-opacity="1" stroke="#4a8ff0" stroke-width="1.6"/><text x="490.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">B · terminieren</text><text x="490.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">z. B. Backupkonzept überarbeiten</text><rect x="150" y="200" width="220" height="140" rx="10" fill="#ee8033" fill-opacity="0.16" stroke="#ee8033" stroke-width="1.2"/><rect x="150" y="200" width="220" height="140" rx="10" fill="none" fill-opacity="1" stroke="#ee8033" stroke-width="1.6"/><text x="260.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">C · delegieren</text><text x="260.0" y="284.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">z. B. Standard-Passwort-Reset</text><rect x="380" y="200" width="220" height="140" rx="10" fill="#6f6f6f" fill-opacity="0.16" stroke="#6f6f6f" stroke-width="1.2"/><rect x="380" y="200" width="220" height="140" rx="10" fill="none" fill-opacity="1" stroke="#6f6f6f" stroke-width="1.6"/><text x="490.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">D · weglassen</text><text x="490.0" y="284.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">z. B. Newsletter sortieren</text><text x="260.0" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">dringend</text><text x="490.0" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">nicht dringend</text><text x="136" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="end" dominant-baseline="middle">wichtig</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="end" dominant-baseline="middle"><tspan x="136" y="261.9">nicht</tspan><tspan x="136" y="278.1">wichtig</tspan></text><text x="320" y="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Im Service-Desk gilt zusätzlich: Priorität = Auswirkung × Dringlichkeit (SLA-Reaktionszeiten)</text></svg>
