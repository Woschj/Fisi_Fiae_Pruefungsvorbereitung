1" stroke="#a0a0a0" stroke-width="2"/><path d="M212 156 L205 285" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M208 190 L230 240 L330 240" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M205 285 L330 290 L335 375 L360 375" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><line x1="236" y1="134" x2="560" y2="176" stroke="#e5484d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#pf)"/><line x1="236" y1="134" x2="560" y2="128" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="3 4"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="430" y="96.5">Monitoroberkante auf oder</tspan><tspan x="430" y="111.5">leicht unter Augenhöhe</tspan></text><text x="400" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">Sehabstand 50–80 cm</text><text x="270" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">~90°</text><text x="300" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">~90°</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle"><tspan x="372" y="338.8">Füße flach</tspan><tspan x="372" y="353.2">auf dem Boden</tspan></text><rect x="620" y="20" width="285" height="152" rx="10" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="632" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">• Blick leicht nach unten (ca. 15–20°)</text><text x="632" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">• Fenster seitlich, Blick parallel zur Fensterfront</text><text x="632" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">• mind. 500 Lux, blendfrei, entspiegeltes Display</text><text x="632" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">• Tastatur mit Handballenfläche davor</text><text x="632" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">• Stuhl mit Lordosenstütze, 5 Rollen</text><text x="632" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">• Sitz-Steh-Wechsel, regelmäßige Pausen</text></svg>
