<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250"><title>Aufbau einer IPv6-Adresse: Präfix, Subnetz-ID und Interface-ID</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="860" height="250" rx="14" fill="#262626"/><rect x="40" y="50" width="89" height="42" rx="8" fill="#4a8ff0" fill-opacity="0.28" stroke="#4a8ff0" stroke-width="1.2"/><text x="84.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">2001</text><text x="133" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">:</text><rect x="137" y="50" width="89" height="42" rx="8" fill="#4a8ff0" fill-opacity="0.28" stroke="#4a8ff0" stroke-width="1.2"/><text x="181.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">0db8</text><text x="230" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">:</text><rect x="234" y="50" width="89" height="42" rx="8" fill="#4a8ff0" fill-opacity="0.28" stroke="#4a8ff0" stroke-width="1.2"/><text x="278.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">85a3</text><text x="327" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">:</text><rect x="331" y="50" width="89" height="42" rx="8" fill="#ee8033" fill-opacity="0.28" stroke="#ee8033" stroke-width="1.2"/><text x="375.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">0010</text><text x="424" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">:</text><rect x="428" y="50" width="89" height="42" rx="8" fill="#2fb164" fill-opacity="0.28" stroke="#2fb164" stroke-width="1.2"/><text x="472.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">0000</text><text x="521" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">:</text><rect x="525" y="50" width="89" height="42" rx="8" fill="#2fb164" fill-opacity="0.28" stroke="#2fb164" stroke-width="1.2"/><text x="569.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">0000</text><text x="618" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">:</text><rect x="622" y="50" width="89" height="42" rx="8" fill="#2fb164" fill-opacity="0.28" stroke="#2fb164" stroke-width="1.2"/><text x="666.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">0000</text><text x="715" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">:</text><rect x="719" y="50" width="89" height="42" rx="8" fill="#2fb164" fill-opacity="0.28" stroke="#2fb164" stroke-width="1.2"/><text x="763.5" y="71.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="17" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">0001</text><path d="M40 104 v8 H323 v-8" stroke="#4a8ff0" fill="none" fill-opacity="1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="181.5" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a8ff0" text-anchor="middle" dominant-baseline="middle">Global Routing Prefix · 48 Bit</text><text x="181.5" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">vom Provider zugewiesen (/48)</text><path d="M331 104 v8 H420 v-8" stroke="#ee8033" fill="none" fill-opacity="1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="375.5" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">Subnetz-ID</text><text x="375.5" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">16 Bit → 65 536 Netze</text><path d="M428 104 v8 H808 v-8" stroke="#2fb164" fill="none" fill-opacity="1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="618.0" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#2fb164" text-anchor="middle" dominant-baseline="middle">Interface-ID · 64 Bit</text><text x="618.0" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Host (SLAAC, EUI-64, zufällig, DHCPv6)</text><text x="430" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">8 Blöcke × 16 Bit = 128 Bit · jeder Block 4 Hex-Ziffern</text><text x="430" y="190" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="16" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Gekürzt: 2001:db8:85a3:10::1</text><text x="430" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Präfix /64 = Netzanteil (Blau + Orange) · In einem LAN-Segment ist das Präfix immer /64</text></svg>
