<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300"><title>Leistungsdreieck: Scheinleistung S, Wirkleistung P und Leistungsfaktor cos φ</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="700" height="300" rx="14" fill="#262626"/><polygon points="80,240 480,240 480,80" fill="#e5484d" fill-opacity="0.08" stroke="#e5484d" stroke-width="1.2" stroke-linejoin="round"/><line x1="80" y1="240" x2="480" y2="240" stroke="#4a8ff0" stroke-width="3"/><line x1="480" y1="240" x2="480" y2="80" stroke="#ee8033" stroke-width="3"/><line x1="80" y1="240" x2="480" y2="80" stroke="#e5484d" stroke-width="3"/><text x="280" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="650" fill="#4a8ff0" text-anchor="middle" dominant-baseline="middle">Wirkleistung P in Watt (W) – wird wirklich genutzt</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#ee8033" text-anchor="start" dominant-baseline="middle"><tspan x="492" y="152.2">Blindleistung Q</tspan><tspan x="492" y="167.8">in var</tspan></text><text x="250" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="650" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">Scheinleistung S in VA</text><path d="M150 240 A70 70 0 0 0 145 214" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="168" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">φ</text><text x="350" y="30" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="16" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">P = S × cos φ     ·     S = P ÷ cos φ</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="610" y="235.0">Beispiel USV:</tspan><tspan x="610" y="250.0">1 000 VA × 0,6</tspan><tspan x="610" y="265.0">= 600 W</tspan></text></svg>
