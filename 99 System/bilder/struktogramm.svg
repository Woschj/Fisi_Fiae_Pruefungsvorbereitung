<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"><title>Struktogramm: Summe aller positiven Werte einer Liste</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="700" height="330" rx="14" fill="#262626"/><rect x="40" y="20" width="620" height="38" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="350.0" y="39.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="500" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">summe ← 0</text><rect x="40" y="58" width="620" height="196" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="54" y="76" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="500" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">FÜR i ← 0 BIS n − 1</text><rect x="76" y="94" width="584" height="60" rx="0" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><path d="M76 94 L368.0 154 L660 94" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="368.0" y="110" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">werte[i] &gt; 0 ?</text><text x="106" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2fb164" text-anchor="middle" dominant-baseline="middle">ja</text><text x="630" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">nein</text><rect x="76" y="154" width="292.0" height="100" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="222.0" y="204.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="13.5" font-weight="500" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">summe ← summe + werte[i]</text><rect x="368.0" y="154" width="292.0" height="100" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="514.0" y="204.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">∅</text><rect x="40" y="254" width="620" height="38" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="350.0" y="273.0" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="500" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">ausgabe(summe)</text><text x="350" y="312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Blöcke statt Pfeile · Schleifenrumpf eingerückt · Verzweigung als Dreieck · ∅ = leerer Zweig</text></svg>
