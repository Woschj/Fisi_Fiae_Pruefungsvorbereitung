<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420"><title>Symmetrische und asymmetrische Verschlüsselung</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="880" height="420" rx="14" fill="#262626"/><text x="440" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Symmetrisch – ein gemeinsamer geheimer Schlüssel (z. B. AES)</text><rect x="40" y="60" width="100" height="44" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="90.0" y="82.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Alice</text><rect x="740" y="60" width="100" height="44" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="790.0" y="82.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Bob</text><rect x="210" y="56" width="140" height="52" rx="8" fill="#4a8ff0" fill-opacity="0.25" stroke="#4a8ff0" stroke-width="1.2"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="280.0" y="74.5">Klartext</tspan><tspan x="280.0" y="89.5">→ verschlüsseln</tspan></text><rect x="390" y="56" width="120" height="52" rx="8" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="450.0" y="74.5">Geheimtext</tspan><tspan x="450.0" y="89.5">%$#&amp;@!</tspan></text><rect x="550" y="56" width="140" height="52" rx="8" fill="#4a8ff0" fill-opacity="0.25" stroke="#4a8ff0" stroke-width="1.2"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="620.0" y="74.5">entschlüsseln</tspan><tspan x="620.0" y="89.5">→ Klartext</tspan></text><line x1="140" y1="82" x2="210" y2="82" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><line x1="350" y1="82" x2="390" y2="82" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><line x1="510" y1="82" x2="550" y2="82" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><line x1="690" y1="82" x2="740" y2="82" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><circle cx="262" cy="140" r="10" fill="none" fill-opacity="1" stroke="#e5484d" stroke-width="3"/><path d="M272 140 H300 M292 140 v8 M298 140 v6" stroke="#e5484d" fill="none" fill-opacity="1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="282" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">Schlüssel K</text><circle cx="602" cy="140" r="10" fill="none" fill-opacity="1" stroke="#e5484d" stroke-width="3"/><path d="M612 140 H640 M632 140 v8 M638 140 v6" stroke="#e5484d" fill="none" fill-opacity="1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="622" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">derselbe K</text><text x="440" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">schnell · Problem: K muss vorher sicher ausgetauscht werden · n Personen → n(n−1)/2 Schlüssel</text><line x1="30" y1="198" x2="850" y2="198" stroke="#4d4d4d" stroke-width="1" stroke-dasharray="4 4"/><text x="440" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Asymmetrisch – Schlüsselpaar des Empfängers (z. B. RSA, ECC)</text><rect x="40" y="260" width="100" height="44" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="90.0" y="282.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Alice</text><rect x="740" y="260" width="100" height="44" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="790.0" y="282.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Bob</text><rect x="210" y="256" width="140" height="52" rx="8" fill="#2fb164" fill-opacity="0.25" stroke="#2fb164" stroke-width="1.2"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="280.0" y="274.5">Klartext</tspan><tspan x="280.0" y="289.5">→ verschlüsseln</tspan></text><rect x="390" y="256" width="120" height="52" rx="8" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="450.0" y="274.5">Geheimtext</tspan><tspan x="450.0" y="289.5">%$#&amp;@!</tspan></text><rect x="550" y="256" width="140" height="52" rx="8" fill="#2fb164" fill-opacity="0.25" stroke="#2fb164" stroke-width="1.2"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="620.0" y="274.5">entschlüsseln</tspan><tspan x="620.0" y="289.5">→ Klartext</tspan></text><line x1="140" y1="282" x2="210" y2="282" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><line x1="350" y1="282" x2="390" y2="282" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><line x1="510" y1="282" x2="550" y2="282" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><line x1="690" y1="282" x2="740" y2="282" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#pf)"/><circle cx="262" cy="340" r="10" fill="none" fill-opacity="1" stroke="#2fb164" stroke-width="3"/><path d="M272 340 H300 M292 340 v8 M298 340 v6" stroke="#2fb164" fill="none" fill-opacity="1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="282" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2fb164" text-anchor="middle" dominant-baseline="middle">Bobs öffentlicher</text><circle cx="602" cy="340" r="10" fill="none" fill-opacity="1" stroke="#e5484d" stroke-width="3"/><path d="M612 340 H640 M632 340 v8 M638 340 v6" stroke="#e5484d" fill="none" fill-opacity="1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="622" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">Bobs privater</text><text x="440" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Verschlüsseln mit dem öffentlichen Schlüssel des Empfängers – nur sein privater Schlüssel entschlüsselt.</text><text x="440" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Signieren umgekehrt: mit dem eigenen privaten Schlüssel, prüfen mit dem öffentlichen. Praxis: hybrid (TLS).</text></svg>
