<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280"><title>Vorgangsknoten im Netzplan mit Beispielwerten</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="760" height="280" rx="14" fill="#262626"/><rect x="60" y="40" width="110.0" height="56" rx="0" fill="#4a8ff0" fill-opacity="0.3" stroke="#4d4d4d" stroke-width="1.2"/><text x="115.0" y="59.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">FAZ</text><text x="115.0" y="79.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">2</text><rect x="170.0" y="40" width="110.0" height="56" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="225.0" y="59.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">D</text><text x="225.0" y="79.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">6</text><rect x="280.0" y="40" width="110.0" height="56" rx="0" fill="#4a8ff0" fill-opacity="0.3" stroke="#4d4d4d" stroke-width="1.2"/><text x="335.0" y="59.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">FEZ</text><text x="335.0" y="79.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">8</text><rect x="60" y="96" width="330" height="56" rx="0" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="225.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">C  Hardware liefern</text><rect x="60" y="152" width="110.0" height="56" rx="0" fill="#ee8033" fill-opacity="0.3" stroke="#4d4d4d" stroke-width="1.2"/><text x="115.0" y="171.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">SAZ</text><text x="115.0" y="191.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">3</text><rect x="170.0" y="152" width="110.0" height="56" rx="0" fill="#e5484d" fill-opacity="0.3" stroke="#4d4d4d" stroke-width="1.2"/><text x="225.0" y="171.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">GP</text><text x="225.0" y="191.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">1</text><rect x="280.0" y="152" width="110.0" height="56" rx="0" fill="#ee8033" fill-opacity="0.3" stroke="#4d4d4d" stroke-width="1.2"/><text x="335.0" y="171.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">SEZ</text><text x="335.0" y="191.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">9</text><rect x="60" y="40" width="330" height="168" rx="6" fill="none" fill-opacity="1" stroke="#a0a0a0" stroke-width="1.8"/><text x="420" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a8ff0" text-anchor="start" dominant-baseline="middle">Vorwärtsrechnung</text><text x="420" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">FEZ = FAZ + D · FAZ = größter FEZ der Vorgänger</text><text x="420" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#ee8033" text-anchor="start" dominant-baseline="middle">Rückwärtsrechnung</text><text x="420" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">SAZ = SEZ − D · SEZ = kleinster SAZ der Nachfolger</text><text x="420" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e5484d" text-anchor="start" dominant-baseline="middle">Gesamtpuffer</text><text x="420" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">GP = SAZ − FAZ (= SEZ − FEZ) · GP = 0 → kritischer Pfad</text><text x="420" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle">Freier Puffer</text><text x="420" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">FP = kleinster FAZ der Nachfolger − eigener FEZ</text><text x="380" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle" font-style="italic">Die Anordnung kann in der Prüfung abweichen – die Legende der Aufgabe gilt.</text></svg>
