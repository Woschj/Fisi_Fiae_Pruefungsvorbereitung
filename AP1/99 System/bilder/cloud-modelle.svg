ight="500" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Netzwerk</text><rect x="645" y="294" width="180" height="30" rx="6" fill="#ee8033" fill-opacity="0.32" stroke="#ee8033" stroke-width="1.2"/><text x="735.0" y="309.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="500" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Rechenzentrum</text><rect x="160" y="350" width="14" height="14" rx="3" fill="#4a8ff0" fill-opacity="0.6" stroke="#4a8ff0" stroke-width="1.2"/><text x="182" y="357" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">verwaltet der Kunde</text><rect x="400" y="350" width="14" height="14" rx="3" fill="#ee8033" fill-opacity="0.6" stroke="#ee8033" stroke-width="1.2"/><text x="422" y="357" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">verwaltet der Anbieter</text><text x="430" y="398" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e0b030" text-anchor="middle" dominant-baseline="middle">Daten, Benutzer und Zugriffsrechte bleiben auch bei SaaS in der Verantwortung des Kunden (DSGVO).</text><text x="430" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Beispiele: IaaS = virtuelle Server (Azure VM, AWS EC2) · PaaS = App-Plattform/Datenbankdienst · SaaS = Microsoft 365, Webmail</text></svg>
