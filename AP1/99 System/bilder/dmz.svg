<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300"><title>Netz mit DMZ: öffentlich erreichbare Server getrennt vom internen LAN</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="860" height="300" rx="14" fill="#262626"/><path d="M40 150 a24 24 0 0 1 34 -26 a30 30 0 0 1 52 6 a22 22 0 0 1 18 38 z" stroke="#a0a0a0" fill="#313131" fill-opacity="1" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="92" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Internet</text><rect x="180" y="120" width="130" height="56" rx="8" fill="#e5484d" fill-opacity="0.25" stroke="#e5484d" stroke-width="1.2"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="245.0" y="139.9">Firewall</tspan><tspan x="245.0" y="156.1">(3 Zonen)</tspan></text><line x1="144" y1="148" x2="180" y2="148" stroke="#a0a0a0" stroke-width="1.8"/><rect x="380" y="30" width="220" height="110" rx="12" fill="#ee8033" fill-opacity="0.1" stroke="#ee8033" stroke-width="1.2" stroke-dasharray="5 4"/><text x="490" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">DMZ (Demilitarized Zone)</text><rect x="395" y="64" width="90" height="56" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="440.0" y="92.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Webserver</text><rect x="495" y="64" width="90" height="56" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="540.0" y="84.5">Mail-</tspan><tspan x="540.0" y="99.5">Relay</tspan></text><rect x="380" y="170" width="220" height="110" rx="12" fill="#4a8ff0" fill-opacity="0.1" stroke="#4a8ff0" stroke-width="1.2" stroke-dasharray="5 4"/><text x="490" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a8ff0" text-anchor="middle" dominant-baseline="middle">Internes LAN</text><rect x="395" y="204" width="90" height="56" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="440.0" y="232.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Clients</text><rect x="495" y="204" width="90" height="56" rx="8" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="540.0" y="224.5">File-/</tspan><tspan x="540.0" y="239.5">DB-Server</tspan></text><path d="M310 140 L380 90" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M310 160 L380 220" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="630" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2fb164" text-anchor="start" dominant-baseline="middle">Internet → DMZ</text><text x="630" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle">nur 443 (Web), 25 (Mail) erlaubt</text><text x="630" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e5484d" text-anchor="start" dominant-baseline="middle">Internet → LAN</text><text x="630" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle">alles gesperrt (Default Deny)</text><text x="630" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2fb164" text-anchor="start" dominant-baseline="middle">LAN → Internet</text><text x="630" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle">erlaubt (Web, Mail), protokolliert</text><text x="630" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e5484d" text-anchor="start" dominant-baseline="middle">DMZ → LAN</text><text x="630" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle">gesperrt – nur gezielte Ausnahmen</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="230" y="255.6">Wird ein Server in der DMZ</tspan><tspan x="230" y="270.0">übernommen, ist das LAN</tspan><tspan x="230" y="284.4">weiter geschützt.</tspan></text></svg>
