<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330"><title>ER-Modell in Chen-Notation: Kunde erteilt Auftrag, Auftrag enthält Artikel</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="860" height="330" rx="14" fill="#262626"/><rect x="60" y="140" width="120" height="50" rx="2" fill="#4a8ff0" fill-opacity="0.25" stroke="#4a8ff0" stroke-width="1.2"/><text x="120.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Kunde</text><rect x="370" y="140" width="120" height="50" rx="2" fill="#4a8ff0" fill-opacity="0.25" stroke="#4a8ff0" stroke-width="1.2"/><text x="430.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Auftrag</text><rect x="680" y="140" width="120" height="50" rx="2" fill="#4a8ff0" fill-opacity="0.25" stroke="#4a8ff0" stroke-width="1.2"/><text x="740.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Artikel</text><polygon points="272,135.0 327.0,165 272,195.0 217.0,165" fill="#ee8033" fill-opacity="0.25" stroke="#ee8033" stroke-width="1.5" stroke-linejoin="round"/><text x="272" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">erteilt</text><polygon points="582,135.0 637.0,165 582,195.0 527.0,165" fill="#ee8033" fill-opacity="0.25" stroke="#ee8033" stroke-width="1.5" stroke-linejoin="round"/><text x="582" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">enthält</text><line x1="180" y1="165" x2="217" y2="165" stroke="#a0a0a0" stroke-width="1.6"/><line x1="327" y1="165" x2="370" y2="165" stroke="#a0a0a0" stroke-width="1.6"/><line x1="490" y1="165" x2="527" y2="165" stroke="#a0a0a0" stroke-width="1.6"/><line x1="637" y1="165" x2="680" y2="165" stroke="#a0a0a0" stroke-width="1.6"/><text x="196" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">1</text><text x="350" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">n</text><text x="505" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">n</text><text x="660" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">m</text><ellipse cx="80" cy="60" rx="52" ry="20" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="1.3"/><text x="80" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle" text-decoration="underline">KundenNr</text><ellipse cx="170" cy="60" rx="38" ry="20" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="1.3"/><text x="170" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Name</text><ellipse cx="90" cy="270" rx="50" ry="20" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="1.3"/><text x="90" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Ort</text><line x1="80" y1="80" x2="100" y2="140" stroke="#4d4d4d" stroke-width="1.2"/><line x1="170" y1="80" x2="150" y2="140" stroke="#4d4d4d" stroke-width="1.2"/><line x1="90" y1="250" x2="110" y2="190" stroke="#4d4d4d" stroke-width="1.2"/><ellipse cx="390" cy="60" rx="52" ry="20" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="1.3"/><text x="390" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle" text-decoration="underline">AuftragNr</text><ellipse cx="490" cy="60" rx="40" ry="20" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="1.3"/><text x="490" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Datum</text><line x1="390" y1="80" x2="410" y2="140" stroke="#4d4d4d" stroke-width="1.2"/><line x1="490" y1="80" x2="470" y2="140" stroke="#4d4d4d" stroke-width="1.2"/><ellipse cx="582" cy="250" rx="44" ry="20" fill="#e0b030" stroke="#e0b030" stroke-width="1.3"/><text x="582" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Menge</text><line x1="582" y1="195" x2="582" y2="230" stroke="#4d4d4d" stroke-width="1.2"/><ellipse cx="700" cy="60" rx="44" ry="20" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="1.3"/><text x="700" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle" text-decoration="underline">ArtNr</text><ellipse cx="800" cy="60" rx="40" ry="20" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="1.3"/><text x="800" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Preis</text><line x1="700" y1="80" x2="720" y2="140" stroke="#4d4d4d" stroke-width="1.2"/><line x1="800" y1="80" x2="780" y2="140" stroke="#4d4d4d" stroke-width="1.2"/><text x="430" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Rechteck = Entitätstyp · Ellipse = Attribut (Schlüssel unterstrichen) · Raute = Beziehung · 1, n, m = Kardinalität</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e0b030" text-anchor="middle" dominant-baseline="middle"><tspan x="700" y="245.6">„Menge“ gehört zur</tspan><tspan x="700" y="260.0">Beziehung (n:m),</tspan><tspan x="700" y="274.4">nicht zu einer Entität</tspan></text></svg>
