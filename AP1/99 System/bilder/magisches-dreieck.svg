<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350"><title>Magisches Dreieck des Projektmanagements</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="640" height="350" rx="14" fill="#262626"/><polygon points="320,50 90,280 550,280" fill="#e5484d" fill-opacity="0.08" stroke="#e5484d" stroke-width="2" stroke-linejoin="round"/><rect x="250" y="18" width="140" height="40" rx="8" fill="#4a8ff0" fill-opacity="0.35" stroke="#4a8ff0" stroke-width="1.2"/><text x="320.0" y="38.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Leistung / Qualität</text><rect x="30" y="270" width="120" height="40" rx="8" fill="#ee8033" fill-opacity="0.35" stroke="#ee8033" stroke-width="1.2"/><text x="90.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Zeit</text><rect x="490" y="270" width="120" height="40" rx="8" fill="#2fb164" fill-opacity="0.35" stroke="#2fb164" stroke-width="1.2"/><text x="550.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Kosten</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="320" y="180.6">Projekt-</tspan><tspan x="320" y="199.4">ziel</tspan></text><text x="320" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Ändert sich eine Größe, müssen die anderen angepasst werden.</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="150" y="142.8">mehr Funktionen</tspan><tspan x="150" y="157.2">→ mehr Zeit/Geld</tspan></text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="490" y="142.8">Budget gekürzt</tspan><tspan x="490" y="157.2">→ weniger Leistung</tspan></text></svg>
