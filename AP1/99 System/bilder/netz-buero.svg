ize="13.5" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Fileserver</text><text x="330.0" y="371.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">RAID · Backup</text><rect x="255" y="395" width="150" height="40" rx="10" fill="#2fb164" fill-opacity="0.16" stroke="#2fb164" stroke-width="1.2"/><rect x="255" y="395" width="150" height="40" rx="10" fill="none" fill-opacity="1" stroke="#2fb164" stroke-width="1.6"/><text x="330.0" y="407.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">NAS</text><text x="330.0" y="426.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Backup-Ziel</text><rect x="465" y="340" width="150" height="40" rx="10" fill="#9b7cf0" fill-opacity="0.16" stroke="#9b7cf0" stroke-width="1.2"/><rect x="465" y="340" width="150" height="40" rx="10" fill="none" fill-opacity="1" stroke="#9b7cf0" stroke-width="1.6"/><text x="540.0" y="352.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Access Point</text><text x="540.0" y="371.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">WPA3 · Isolation</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="540" y="404.8">Gäste: nur Internet,</tspan><tspan x="540" y="419.2">kein Zugriff aufs LAN</tspan></text><re