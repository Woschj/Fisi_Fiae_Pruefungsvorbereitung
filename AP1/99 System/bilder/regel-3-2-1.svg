<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280"><title>3-2-1-Regel der Datensicherung</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="860" height="280" rx="14" fill="#262626"/><text x="430" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">3 Kopien · 2 verschiedene Medien · 1 Kopie außer Haus (+ 1 offline/unveränderbar)</text><rect x="40" y="60" width="240" height="150" rx="14" fill="#4a8ff0" fill-opacity="0.12" stroke="#4a8ff0" stroke-width="1.2"/><rect x="40" y="60" width="240" height="150" rx="14" fill="none" fill-opacity="1" stroke="#4a8ff0" stroke-width="1.8"/><text x="160" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#4a8ff0" text-anchor="middle" dominant-baseline="middle">Kopie 1</text><text x="160" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Originaldaten</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="160" y="144.2">Fileserver</tspan><tspan x="160" y="159.8">(SSD, RAID)</tspan></text><line x1="284" y1="135" x2="306" y2="135" stroke="#a0a0a0" stroke-width="1.8" marker-end="url(#pf)"/><rect x="310" y="60" width="240" height="150" rx="14" fill="#2fb164" fill-opacity="0.12" stroke="#2fb164" stroke-width="1.2"/><rect x="310" y="60" width="240" height="150" rx="14" fill="none" fill-opacity="1" stroke="#2fb164" stroke-width="1.8"/><text x="430" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#2fb164" text-anchor="middle" dominant-baseline="middle">Kopie 2</text><text x="430" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Backup vor Ort</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="430" y="144.2">NAS im Serverraum</tspan><tspan x="430" y="159.8">(schneller Restore)</tspan></text><line x1="554" y1="135" x2="576" y2="135" stroke="#a0a0a0" stroke-width="1.8" marker-end="url(#pf)"/><rect x="580" y="60" width="240" height="150" rx="14" fill="#ee8033" fill-opacity="0.12" stroke="#ee8033" stroke-width="1.2"/><rect x="580" y="60" width="240" height="150" rx="14" fill="none" fill-opacity="1" stroke="#ee8033" stroke-width="1.8"/><text x="700" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">Kopie 3</text><text x="700" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Backup außer Haus</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="700" y="144.2">Cloud-Speicher oder</tspan><tspan x="700" y="159.8">LTO-Band im Tresor</tspan></text><path d="M40 222 H550" stroke="#a0a0a0" fill="none" fill-opacity="1" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="295" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Standort 1 (Firma) – Medium 1: Festplatten</text><path d="M580 222 H820" stroke="#ee8033" fill="none" fill-opacity="1" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="700" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">Standort 2 – Medium 2</text><text x="430" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Schützt gegen Plattendefekt, Löschen, Ransomware, Brand und Diebstahl – aber nur mit regelmäßigen Restore-Tests.</text></svg>
