<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"><title>Relationales Tabellenmodell mit Primär- und Fremdschlüsseln</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="880" height="300" rx="14" fill="#262626"/><rect x="20" y="40" width="190" height="30" rx="4" fill="#4a8ff0" fill-opacity="0.35" stroke="#4a8ff0" stroke-width="1.2"/><text x="115.0" y="55.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">kunde</text><rect x="20" y="70" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="42" y="83" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#e0b030" text-anchor="middle" dominant-baseline="middle">PK</text><text x="66" y="83" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="600" fill="#e0b030" text-anchor="start" dominant-baseline="middle">kunden_nr</text><rect x="20" y="96" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="66" y="109" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">name</text><rect x="20" y="122" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="66" y="135" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">ort</text><rect x="240" y="40" width="190" height="30" rx="4" fill="#4a8ff0" fill-opacity="0.35" stroke="#4a8ff0" stroke-width="1.2"/><text x="335.0" y="55.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">auftrag</text><rect x="240" y="70" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="262" y="83" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#e0b030" text-anchor="middle" dominant-baseline="middle">PK</text><text x="286" y="83" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="600" fill="#e0b030" text-anchor="start" dominant-baseline="middle">auftrag_nr</text><rect x="240" y="96" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="286" y="109" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">datum</text><rect x="240" y="122" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="262" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">FK</text><text x="286" y="135" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="600" fill="#ee8033" text-anchor="start" dominant-baseline="middle">kunden_nr</text><rect x="460" y="40" width="200" height="30" rx="4" fill="#ee8033" fill-opacity="0.35" stroke="#ee8033" stroke-width="1.2"/><text x="560.0" y="55.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">auftrag_position</text><rect x="460" y="70" width="200" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="482" y="83" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">FK</text><text x="506" y="83" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="600" fill="#ee8033" text-anchor="start" dominant-baseline="middle">auftrag_nr</text><rect x="460" y="96" width="200" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="482" y="109" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#ee8033" text-anchor="middle" dominant-baseline="middle">FK</text><text x="506" y="109" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="600" fill="#ee8033" text-anchor="start" dominant-baseline="middle">art_nr</text><rect x="460" y="122" width="200" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="506" y="135" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">menge</text><rect x="690" y="40" width="190" height="30" rx="4" fill="#4a8ff0" fill-opacity="0.35" stroke="#4a8ff0" stroke-width="1.2"/><text x="785.0" y="55.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">artikel</text><rect x="690" y="70" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="712" y="83" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#e0b030" text-anchor="middle" dominant-baseline="middle">PK</text><text x="736" y="83" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="600" fill="#e0b030" text-anchor="start" dominant-baseline="middle">art_nr</text><rect x="690" y="96" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="736" y="109" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">bezeichnung</text><rect x="690" y="122" width="190" height="26" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="736" y="135" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">preis</text><path d="M210 83 H225 V148 H240" stroke="#ee8033" fill="none" fill-opacity="1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="215" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">1 : n</text><path d="M430 83 H445 V96 H460" stroke="#ee8033" fill="none" fill-opacity="1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M690 83 H675 V122 H660" stroke="#ee8033" fill="none" fill-opacity="1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#ee8033" text-anchor="middle" dominant-baseline="middle"><tspan x="560" y="162.5">Zwischentabelle löst n:m auf</tspan><tspan x="560" y="177.5">PK = (auftrag_nr, art_nr)</tspan></text><text x="440" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">PK (Primärschlüssel): identifiziert jede Zeile eindeutig · FK (Fremdschlüssel): verweist auf den PK einer anderen Tabelle</text><text x="440" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">1:n → FK auf die n-Seite · n:m → eigene Tabelle mit beiden FKs (+ Beziehungsattribute wie „menge“)</text><text x="440" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Redundanzfrei: Kundenname steht nur in „kunde“ – Änderung an einer Stelle, keine Anomalien</text></svg>
