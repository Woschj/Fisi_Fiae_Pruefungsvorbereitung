<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420"><title>UML-Klassendiagramm mit Vererbung, Komposition, Aggregation und Multiplizitäten</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="880" height="420" rx="14" fill="#262626"/><rect x="330" y="20" width="220" height="30" rx="0" fill="#4a8ff0" fill-opacity="0.3" stroke="#4a8ff0" stroke-width="1.2"/><text x="440.0" y="35.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Geraet</text><rect x="330" y="50" width="220" height="70" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><rect x="330" y="120" width="220" height="50" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="340" y="65" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">- inventarNr : String</text><text x="340" y="85" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">- kaufdatum : Date</text><text x="340" y="105" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle"># preis : double</text><text x="340" y="135" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">+ getAlter() : int</text><text x="340" y="155" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">+ ausleihen() : void</text><rect x="130" y="230" width="200" height="30" rx="0" fill="#2fb164" fill-opacity="0.3" stroke="#2fb164" stroke-width="1.2"/><text x="230.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Notebook</text><rect x="130" y="260" width="200" height="30" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><rect x="130" y="290" width="200" height="30" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="140" y="275" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">- akkuWh : int</text><text x="140" y="305" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">+ laden() : void</text><rect x="550" y="230" width="200" height="30" rx="0" fill="#2fb164" fill-opacity="0.3" stroke="#2fb164" stroke-width="1.2"/><text x="650.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Monitor</text><rect x="550" y="260" width="200" height="30" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><rect x="550" y="290" width="200" height="30" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="560" y="275" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">- zoll : double</text><text x="560" y="305" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">+ kalibrieren() : void</text><path d="M230 230 V200 H650 V230" stroke="#e2e3e4" fill="none" fill-opacity="1" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="440" y1="200" x2="440" y2="172" stroke="#e2e3e4" stroke-width="1.4"/><polygon points="440,160 432,174 448,174" fill="#262626" fill-opacity="1" stroke="#e2e3e4" stroke-width="1.4" stroke-linejoin="round"/><text x="470" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle">Vererbung</text><rect x="20" y="20" width="170" height="30" rx="0" fill="#ee8033" fill-opacity="0.3" stroke="#ee8033" stroke-width="1.2"/><text x="105.0" y="35.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Akku</text><rect x="20" y="50" width="170" height="30" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><rect x="20" y="80" width="170" height="10" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="30" y="65" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">- zyklen : int</text><polygon points="150,230 144,218 150,206 156,218" fill="#e2e3e4" fill-opacity="1" stroke="#e2e3e4" stroke-width="1.2" stroke-linejoin="round"/><line x1="150" y1="206" x2="150" y2="90" stroke="#e2e3e4" stroke-width="1.4"/><text x="162" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#e5484d" text-anchor="start" dominant-baseline="middle">1</text><text x="162" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#e5484d" text-anchor="start" dominant-baseline="middle">1</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle"><tspan x="92" y="136.2">Komposition:</tspan><tspan x="92" y="150.0">Akku existiert</tspan><tspan x="92" y="163.8">nicht ohne Notebook</tspan></text><rect x="690" y="20" width="170" height="30" rx="0" fill="#9b7cf0" fill-opacity="0.3" stroke="#9b7cf0" stroke-width="1.2"/><text x="775.0" y="35.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle">Abteilung</text><rect x="690" y="50" width="170" height="30" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><rect x="690" y="80" width="170" height="10" rx="0" fill="#313131" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2"/><text x="700" y="65" font-family="ui-monospace, Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#e2e3e4" text-anchor="start" dominant-baseline="middle">- name : String</text><polygon points="690,62 678,56 666,62 678,68" fill="#262626" fill-opacity="1" stroke="#e2e3e4" stroke-width="1.4" stroke-linejoin="round"/><line x1="666" y1="62" x2="550" y2="62" stroke="#e2e3e4" stroke-width="1.4"/><text x="655" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">1</text><text x="562" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#e5484d" text-anchor="middle" dominant-baseline="middle">0..*</text><text x="610" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Aggregation</text><text x="440" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Sichtbarkeit: + public · - private · # protected · ~ package</text><text x="440" y="376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Multiplizität: 1 genau eins · 0..1 höchstens eins · * bzw. 0..* beliebig · 1..* mindestens eins</text><text x="440" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">◆ Komposition (Teil stirbt mit dem Ganzen) · ◇ Aggregation (Teil existiert eigenständig) · ▷ Vererbung (ist-ein)</text></svg>
