<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"><title>Vier-Seiten-Modell einer Nachricht nach Schulz von Thun</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker></defs><rect x="0" y="0" width="760" height="350" rx="14" fill="#262626"/><polygon points="380,74 476,170 380,266 284,170" fill="#3a3a3a" fill-opacity="1" stroke="#4d4d4d" stroke-width="1.2" stroke-linejoin="round"/><text x="380" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a8ff0" text-anchor="middle" dominant-baseline="middle">Sachinhalt</text><text x="380" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Worüber informiere ich?</text><text x="492" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e5484d" text-anchor="start" dominant-baseline="middle">Appell</text><text x="492" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="start" dominant-baseline="middle">Wozu will ich dich bringen?</text><text x="380" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#2fb164" text-anchor="middle" dominant-baseline="middle">Beziehung</text><text x="380" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Was halte ich von dir?</text><text x="268" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#ee8033" text-anchor="end" dominant-baseline="middle">Selbstoffenbarung</text><text x="268" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a0a0" text-anchor="end" dominant-baseline="middle">Was gebe ich von mir preis?</text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="380" y="154.2">„Der Drucker ist</tspan><tspan x="380" y="169.8">schon wieder leer.“</tspan></text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="90" y="51.9">Sender</tspan><tspan x="90" y="68.1">(„vier Schnäbel“)</tspan></text><text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e3e4" text-anchor="middle" dominant-baseline="middle"><tspan x="670" y="51.9">Empfänger</tspan><tspan x="670" y="68.1">(„vier Ohren“)</tspan></text><line x1="110" y1="88" x2="326" y2="118" stroke="#a0a0a0" stroke-width="1.4" marker-end="url(#pf)"/><line x1="434" y1="118" x2="650" y2="88" stroke="#a0a0a0" stroke-width="1.4" marker-end="url(#pf)"/><text x="380" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">Missverständnisse entstehen, wenn Sender und Empfänger unterschiedliche Seiten betonen.</text></svg>
